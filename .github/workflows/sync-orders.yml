name: Sync Executive Orders

on:
  schedule:
    # Runs twice every weekday (6:00 AM UTC and 6:00 PM UTC / roughly 2 AM and 2 PM Eastern)
    - cron: '0 6,18 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: sync-orders
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest executive orders from Federal Register
        run: |
          PYTHONPATH=scripts python scripts/sync_orders.py

      - name: Run constitutional analysis on newly ingested orders
        run: |
          PYTHONPATH=scripts python scripts/batch_constitutional_worker.py

      - name: Export static site data (site_orders.json, summary, stats)
        run: |
          PYTHONPATH=scripts python scripts/export_site_data.py

      - name: Rebuild client search index
        run: |
          PYTHONPATH=scripts python scripts/build_search_index.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the DB plus every generated artifact the live site actually reads.
          git add data/orders.sqlite data/stats.json data/sync_status.json \
                  data/site_orders.json data/site_orders_summary.json \
                  public/search_index.json

          # stats.json/sync_status.json carry a fresh timestamp on every run even when
          # no orders changed, so check the actual content files to decide whether this
          # run needs to trigger a Cloudflare Pages rebuild.
          if git diff --staged --quiet -- data/orders.sqlite data/site_orders.json data/site_orders_summary.json public/search_index.json; then
            echo "No new executive orders found. Committing routine timestamp update only (no deploy)."
            git commit -m "chore(data): sync check, no new orders [skip ci]"
            git push
          else
            echo "New executive orders detected! Committing changes..."
            git commit -m "chore(data): auto-sync latest executive orders"
            git push
          fi
