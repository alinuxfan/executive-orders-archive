name: Sync Executive Orders

on:
  schedule:
    # Runs twice every weekday (6:00 AM UTC and 6:00 PM UTC / roughly 2 AM and 2 PM Eastern)
    - cron: '0 6,18 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: sync-orders
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest executive orders from Federal Register
        run: |
          PYTHONPATH=scripts python scripts/sync_orders.py

      - name: Run constitutional analysis on newly ingested orders
        run: |
          PYTHONPATH=scripts python scripts/batch_constitutional_worker.py

      - name: Export static site data (site_orders.json, summary, stats)
        run: |
          PYTHONPATH=scripts python scripts/export_site_data.py

      - name: Rebuild client search index
        run: |
          PYTHONPATH=scripts python scripts/build_search_index.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the DB plus every generated artifact the live site actually reads.
          git add data/orders.sqlite data/stats.json data/sync_status.json \
                  data/site_orders.json data/site_orders_summary.json \
                  public/search_index.json

          # stats.json/sync_status.json carry a fresh timestamp on every run even when
          # no orders changed, so check the actual content files to decide whether this
          # run needs to trigger a Cloudflare Pages rebuild.
          if git diff --staged --quiet -- data/orders.sqlite data/site_orders.json data/site_orders_summary.json public/search_index.json; then
            echo "No new executive orders found. Committing routine timestamp update only (no deploy)."
            git commit -m "chore(data): sync check, no new orders [skip ci]"
            git push
          else
            echo "New executive orders detected! Committing changes..."
            git commit -m "chore(data): auto-sync latest executive orders"
            git push
          fi

      - name: Alert if a data file is approaching GitHub's 100MB limit
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Advisory only: never fails the job, even if the threshold is crossed
          # or the gh calls below hit an error. The sync/commit/push above has
          # already succeeded by the time this step runs.
          THRESHOLD_BYTES=$((90 * 1024 * 1024))
          OVER=""
          for f in data/orders.sqlite data/site_orders.json data/site_orders_summary.json public/search_index.json; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "$f: ${SIZE_MB}MB"
              if [ "$SIZE" -ge "$THRESHOLD_BYTES" ]; then
                OVER="${OVER}- \`$f\`: ${SIZE_MB}MB\n"
              fi
            fi
          done

          if [ -z "$OVER" ]; then
            echo "All tracked data files are under the 90MB alert threshold."
            exit 0
          fi

          gh label create data-size-alert \
            --color B60205 \
            --description "A tracked data file is approaching GitHub's 100MB per-file limit" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label data-size-alert --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Data file approaching GitHub's 100MB limit" \
              --label data-size-alert \
              --body "$(printf 'One or more tracked data files crossed the 90MB alert threshold, approaching GitHub'"'"'s 100MB hard per-file limit:\n\n%b\nSee AGENTS.md for the data pipeline layout. Options: trim/VACUUM the affected file(s), or move generated artifacts (site_orders*.json, search_index.json) out of git entirely (e.g. Cloudflare R2) before a push gets rejected.\n' "$OVER")"
            echo "Opened new data-size-alert issue."
          else
            echo "data-size-alert issue #$EXISTING is already open; not creating a duplicate."
          fi
